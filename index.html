<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peloton Performance Club</title><style>body{font:16px system-ui;background:#101c28;color:#eef5fa;margin:0}main{max-width:740px;margin:auto;padding:20px}section{background:#203345;border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #789;box-sizing:border-box}input:not([type=checkbox]),select{width:100%}button{background:#b6e34a;color:#15200b;font-weight:bold;margin:5px 3px;cursor:pointer}button:disabled{background:#84919b;cursor:default}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}small{color:#cad8e5}h1{font-size:24px}[hidden]{display:none!important}</style><main><h1>🚴 Peloton Performance Club</h1><p>Groupe Route Hillion</p><p id="msg" role="status" aria-live="polite"></p><section id="auth"><h2>Connexion / inscription</h2><form id="login"><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Mot de passe<input name="password" type="password" minlength="8" required autocomplete="current-password"></label><button>Se connecter</button><button type="button" id="signup">Créer un compte</button></form></section><button id="logout" hidden>Déconnexion</button><section id="member" hidden><h2>Inscription au club</h2><form id="memberForm"><label>Prénom<input name="first_name" required maxlength="100"></label><label>Nom<input name="last_name" required maxlength="100"></label><button>Enregistrer</button></form></section><section id="profile" hidden><h2>Profil privé (facultatif)</h2><form id="profileForm"><label>Date de naissance<input name="birth_date" type="date"></label><label>Taille (cm)<input name="height_cm" type="number" min="80" max="250"></label><label>Poids (kg)<input name="weight_kg" type="number" min="25" max="300" step="0.1"></label><label>FC max<input name="max_hr" type="number" min="80" max="240"></label><label>FTP (W)<input name="ftp_w" type="number" min="30" max="800"></label><label>Heures par semaine<input name="weekly_hours" type="number" min="0" max="40" step="0.5"></label><label>Objectifs<input name="goals"></label><label><input name="power_meter" type="checkbox"> Capteur de puissance</label><label><input name="heart_rate_monitor" type="checkbox"> Ceinture cardiaque</label><label><input name="gps_computer" type="checkbox"> Compteur GPS</label><label><input name="smart_watch" type="checkbox"> Montre connectée</label><label><input name="indoor_trainer" type="checkbox"> Home trainer</label><label>Intervals.icu<select name="intervals_choice"><option value="later">Plus tard</option><option value="has">Compte existant</option><option value="create">Créer un compte</option></select></label><a href="https://intervals.icu" target="_blank" rel="noopener">Ouvrir Intervals.icu</a><button>Enregistrer mon profil</button></form></section><section id="cockpit" hidden><h2>Cockpit</h2><p id="status"></p><div class="tiles" id="tiles"></div></section><section id="admin" hidden><h2>Administration</h2><div id="members"></div></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.49.4';
const db=createClient('https://eifkipeeoomycteqzsex.supabase.co',"sb_publishable_42LX2WaoHxkY2qlYg_N5lg_0TXUGzUm");
const $=id=>document.getElementById(id), show=(id,v)=>$(id).hidden=!v, msg=t=>$('msg').textContent=t;
let user=null;const checked=['power_meter','heart_rate_monitor','gps_computer','smart_watch','indoor_trainer'];const nums=['height_cm','weight_kg','max_hr','ftp_w','weekly_hours'];
function must(r){if(r.error)throw r.error;return r.data}
function run(f){return async e=>{e?.preventDefault();try{await f()}catch(err){msg(err.message||'Erreur de connexion')}}}
async function refresh(){user=must(await db.auth.getUser()).user;show('auth',!user);show('logout',!!user);for(const id of ['member','profile','cockpit','admin'])show(id,false);if(!user)return;const m=must(await db.from('club_members').select('*').eq('user_id',user.id).maybeSingle());const a=must(await db.from('club_admins').select('user_id').eq('user_id',user.id).maybeSingle());show('member',!m);if(m){show('profile',true);show('cockpit',true);$('status').textContent=({pending:'Inscription en attente de validation',approved:'Compte validé',suspended:'Compte suspendu'})[m.status];const pr=must(await db.from('rider_private_profiles').select('*').eq('user_id',user.id).maybeSingle());for(const el of $('profileForm').elements){if(!el.name)continue;if(checked.includes(el.name))el.checked=!!pr?.[el.name];else el.value=pr?.[el.name]??(el.name==='intervals_choice'?'later':'')}const tiles=$('tiles');tiles.replaceChildren();for(const t of ['Mon profil','Récupération','Ma séance','Performance','Parcours GPX / BRouter','Sorties club','Messagerie','Intervals.icu']){const b=document.createElement('button');b.textContent=t+(t==='Mon profil'?'':' · à venir');b.disabled=t!=='Mon profil';b.onclick=()=>$('profile').scrollIntoView();tiles.append(b)}}if(a){show('admin',true);const rows=must(await db.from('club_members').select('user_id,first_name,last_name,status').order('created_at'));$('members').replaceChildren();for(const r of rows){const div=document.createElement('div');div.textContent=r.first_name+' '+r.last_name+' — '+r.status;for(const [s,l] of [['approved','Valider'],['suspended','Suspendre'],['pending','Remettre en attente']]){const b=document.createElement('button');b.textContent=l;b.onclick=run(async()=>{must(await db.from('club_members').update({status:s}).eq('user_id',r.user_id).select('status').single());await refresh()});div.append(b)}$('members').append(div)}}}
function creds(){const f=$('login');if(!f.reportValidity())throw Error('Vérifie les champs');return Object.fromEntries(new FormData(f))}
$('login').onsubmit=run(async()=>{must(await db.auth.signInWithPassword(creds()));msg('Connecté');await refresh()});
$('signup').onclick=run(async()=>{const r=must(await db.auth.signUp(creds()));msg(r.session?'Compte créé':'Confirme ton email puis reconnecte-toi.');if(r.session)await refresh()});
$('logout').onclick=run(async()=>{must(await db.auth.signOut());location.reload()});
$('memberForm').onsubmit=run(async()=>{const f=Object.fromEntries(new FormData($('memberForm')));must(await db.from('club_members').insert({user_id:user.id,first_name:f.first_name.trim(),last_name:f.last_name.trim()}));msg('Inscription enregistrée');await refresh()});
$('profileForm').onsubmit=run(async()=>{const f=$('profileForm'), v=Object.fromEntries(new FormData(f));for(const n of nums)v[n]=v[n]===''?null:Number(v[n]);for(const n of checked)v[n]=f.elements[n].checked;v.birth_date=v.birth_date||null;must(await db.from('rider_private_profiles').upsert({...v,user_id:user.id}));msg('Profil enregistré')});
const session=await db.auth.getSession();if(session.data.session)run(refresh)();
</script></html>
